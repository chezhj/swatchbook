name: Release & Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Never let two deploys touch the server at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP: swatchbook # <- the <app> argument for activate.sh/rollback.sh
  VERSION_FILE: config/__init__.py

jobs:
  test:
    name: Verify tag & run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches __version__
        run: |
          file_version="v$(grep -oP '__version__ = "\K[^"]+' "${VERSION_FILE}")"
          echo "tag=${GITHUB_REF_NAME} file=${file_version}"
          if [ "${file_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ${VERSION_FILE} (${file_version})"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

      # Fail fast on a broken frontend build too, before a release is created.
      # frontend/package-lock.json is the reproducibility guarantee here.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  ship:
    name: Build & ship (no server-side mutation)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build once, here. The server never runs `poetry`, `npm`, or a compiler -
      # it only ever receives a tree that's already complete.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Poetry 2.x dropped `export` as a built-in command - it's a separate
      # plugin now. `poetry self add poetry-plugin-export` is known to
      # silently fail to register on non-root runners (python-poetry/poetry
      # issue #10341), which GitHub Actions runners are. Since Poetry itself
      # is installed via plain `pip install` here (not the official
      # installer/pipx), installing the plugin the same way avoids that bug.
      - name: Generate requirements.txt from the lockfile
        run: |
          pip install poetry poetry-plugin-export
          poetry export --without-hashes -f requirements.txt -o requirements.txt

      - name: Attach requirements.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" requirements.txt --clobber

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Ships the built tree straight into releases/<app>_<tag>/ on the
      # server. No git clone, no deploy key on the server side. Adjust the
      # exclude list per repo if there's more that shouldn't ship.
      #
      # This job touches nothing about the LIVE app - it only populates a
      # brand new, inert releases/<app>_<tag>/ directory. Safe to run
      # unattended every time.
      - name: Ship release via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.pytest_cache' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'tests' \
            --exclude 'frontend' \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22}" \
            ./ "${SSH_USER}@${SSH_HOST}:domains/releases/${{ env.APP }}_${GITHUB_REF_NAME}/"

  activate:
    name: Activate on server
    needs: ship
    runs-on: ubuntu-latest
    # Everything from here on touches the live app: pip install into the
    # shared venv, migrate, symlink swap, restart. Add yourself as a required
    # reviewer on this environment (Settings > Environments > production) to
    # get a manual "Review deployment" pause right here - after ship has
    # already put the files on the server, before anything is activated.
    environment: production
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Activate on server
        id: activate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "bash -lc 'cd ~/domains && ./activate.sh ${{ env.APP }} ${GITHUB_REF_NAME}'"

      - name: Smoke test
        id: smoke
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Read SMOKE_URL out of the app's own config rather than duplicating
          # it in the workflow.
          smoke_url=$(ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "bash -lc 'cd ~/domains && source ${{ env.APP }}_config.sh && echo \$SMOKE_URL'")
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${smoke_url}" || echo 000)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed - ${smoke_url} never returned 200"
          exit 1

      - name: Roll back
        if: failure() && (steps.activate.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "::warning::Deploy failed - rolling back code (database is left untouched)"
          set +e
          output=$(ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "bash -lc 'cd ~/domains && ./rollback.sh ${{ env.APP }}'" 2>&1)
          rollback_status=$?
          set -e
          echo "$output"

          {
            echo "## Deploy failed - rollback report"
            echo ""
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$output" | grep -q "MIGRATION_MAY_HAVE_RUN"; then
            echo "::warning::Code rolled back. Migrations may have run against the live database - it was NOT restored automatically. SSH in and run ./rollback.sh ${{ env.APP }} --restore-db if you want to revert the data too (this discards writes made since the migration)."
          fi

          exit "$rollback_status"
